<!DOCTYPE html>
<html lang="ko">

  <meta charset="UTF-8">

    body { font-family: 'Pretendard', sans-serif; }

<body class="bg-slate-900 text-slate-100 min-h-screen pb-16">

        </div>
      </div>

        <button onclick="openVolManagerModal()" class="px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold flex items-center gap-1.5 transition shadow-sm">

          <span>봉사자 명단 관리</span>
        </button>
        <button onclick="exportToCSV()" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs font-semibold flex items-center gap-1.5 transition">
          <i data-lucide="download" class="w-3.5 h-3.5 text-emerald-400"></i>

        </button>

          <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          <span>배정 초기화</span>
        </button>
      </div>
    </div>
  </header>

      </div>

      </div>

          <p id="statProgress" class="text-xl font-bold text-indigo-400">0.0%</p>
        </div>
      </div>
    </section>

          </div>

      ["78", "가든주유소"], ["79", "빌리브범어"], ["80", "장원맨션"],
      ["81", "우방청솔맨션"], ["82", "범어삼성쉐르빌"], ["83", "범어효성해링턴플레이스"],
      ["84", "신통외국어학원"], ["85", "하이카프라자"], ["86", "빌리브범어120"],
      ["87", "남부상가시장"], ["88", "아크로타워"], ["89", "아크로타워부동산"],
      ["90", "범어라온프라이빗"], ["91", "그린힐골프연습장"], ["92", "덕일어린이집"],
      ["93", "꼬 치킨"], ["94", "범양맨션"], ["95", "범어브릿지부동산"],
      ["96", "롯데리아"], ["97", "동진아파트"], ["98", "참기름"],
      ["99", "만촌교회"], ["100", "오성중고교"], ["101", "성광타운"],
      ["102", "오성골프 앞 주택"], ["103", "오성골프연습장"], ["104", "버거킹 대구만촌점"],
      ["105", "수성대학교"], ["106", "만촌3동주민센터"], ["107", "만촌119안전센터"],
      ["108", "만촌시장"], ["109", "성좌아파트"], ["110", "소선여중"],
      ["111", "대청초등학교"], ["112", "혜화여고"], ["113", "만촌3동경로당"],
      ["114", "만촌자이르네"], ["115", "산장맨션"], ["116", "만촌삼정그린코아"],
      ["117(X)", "뉴대구어린이집(재개발)"], ["118(X)", "새마을금고(재개발)"], ["119", "만촌화성파크드림3차"],
      ["120", "대륜중고/우방팔레스"], ["121(X)", "페도라안경(재개발)"], ["122(X)", "한도아파트(재개발)"],
      ["123", "만촌우방2차"], ["124", "만촌우방1차"]
    ];

    let zones = rawZones.map((item, idx) => ({ 
      id: idx + 1, 
      no: item[0], 
      name: item[1],
      assignedVols: []
    }));

    const savedAssignments = JSON.parse(localStorage.getItem('v6_zone_assignments')) || {};
    zones.forEach(z => {
      if (savedAssignments[z.id]) {
        z.assignedVols = savedAssignments[z.id];
      }
    });

    let currentFilter = 'all';

    function init() {
      updateTotalVolCount();
      renderZoneGrid();
    }

    function updateTotalVolCount() {
      document.getElementById('statTotalVol').innerHTML = `${dynamicVolunteers.length}<span class="text-xs font-normal text-slate-400 ml-1">명</span>`;
    }

    function setFilter(f) {
      currentFilter = f;
      ['all', 'unassigned', 'assigned'].forEach(type => {
        const btn = document.getElementById('filter' + type.charAt(0).toUpperCase() + type.slice(1));
        if (type === f) {
          btn.className = 'px-3 py-1.5 rounded-lg bg-blue-600 text-white font-semibold transition';
        } else {
          btn.className = 'px-3 py-1.5 rounded-lg text-slate-400 hover:text-white transition';
        }
      });
      renderZoneGrid();
    }

    function renderZoneGrid() {
      const q = document.getElementById('adminSearchInput').value.trim().toLowerCase();
      const container = document.getElementById('adminZoneGrid');

      const totalAssignedPeople = zones.reduce((acc, z) => acc + z.assignedVols.length, 0);
      const assignedZonesCount = zones.filter(z => z.assignedVols.length > 0).length;
      const unassignedZonesCount = zones.length - assignedZonesCount;
      const progress = ((assignedZonesCount / zones.length) * 100).toFixed(1);

      document.getElementById('statAssigned').innerHTML = `${totalAssignedPeople}명 <span class="text-xs font-normal text-slate-400">/ ${assignedZonesCount}곳</span>`;
      document.getElementById('statUnassignedZones').innerHTML = `${unassignedZonesCount}<span class="text-xs font-normal text-slate-400 ml-1">곳</span>`;
      document.getElementById('statProgress').innerText = `${progress}%`;

      const filtered = zones.filter(z => {
        const hasVols = z.assignedVols.length > 0;
        const matchFilter = currentFilter === 'all' ? true : (currentFilter === 'assigned' ? hasVols : !hasVols);
        const matchQuery = z.no.toLowerCase().includes(q) || 
                             z.name.toLowerCase().includes(q) || 
                             z.assignedVols.some(v => v.name.toLowerCase().includes(q) || v.phone.includes(q));
        return matchFilter && matchQuery;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div class="col-span-full py-16 text-center text-slate-500 text-xs">일치하는 구역 데이터가 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(z => {
        const count = z.assignedVols.length;
        const isAssigned = count > 0;

        return `
          <div class="p-3.5 bg-slate-900/70 border rounded-2xl flex flex-col justify-between space-y-3 transition-all ${isAssigned ? 'border-blue-500/40 bg-blue-950/10' : 'border-slate-700/60'}">
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-2 overflow-hidden">
                <span class="px-2 py-0.5 rounded-md font-mono font-bold text-xs shrink-0 ${isAssigned ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-300'}">${z.no}호</span>
                <span class="text-xs font-bold text-slate-200 truncate">${z.name}</span>
              </div>
              <span class="text-[10px] px-2 py-0.5 rounded-full font-bold shrink-0 ${isAssigned ? 'bg-blue-500/10 text-blue-400 border border-blue-500/20' : 'bg-slate-800 text-slate-500'}">
                ${isAssigned ? `${count}명 배정` : '미배정'}
              </span>
            </div>

            <div class="pt-2 border-t border-slate-800/80 space-y-1.5 min-h-[36px]">
              ${isAssigned ? z.assignedVols.map(v => `
                <div class="flex items-center justify-between bg-slate-800/60 px-2 py-1 rounded-lg text-xs">
                  <div class="flex items-center gap-1.5">
                    <i data-lucide="user" class="w-3 h-3 text-blue-400"></i>
                    <span class="font-bold text-slate-200">${v.name}</span>
                    <span class="text-[10px] text-slate-400 font-mono">(${v.phone.slice(-4)})</span>
                  </div>
                  <button onclick="unassignVolunteer(${z.id}, ${v.id})" class="text-[10px] text-rose-400 hover:text-rose-300 transition">제외</button>
                </div>
              `).join('') : `
                <div class="text-[11px] text-slate-500 italic flex items-center gap-1 py-1">
                  <i data-lucide="clock" class="w-3 h-3 text-slate-600"></i>
                  <span>배정 대기 중</span>
                </div>
              `}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    // 봉사자 모달 관련 기능
    function openVolManagerModal() {
      document.getElementById('volManagerModal').classList.remove('hidden');
      renderVolListInModal();
    }

    function closeVolManagerModal() {
      document.getElementById('volManagerModal').classList.add('hidden');
      updateTotalVolCount();
    }

    function renderVolListInModal() {
      const q = document.getElementById('volManagerSearch').value.trim().toLowerCase();
      const container = document.getElementById('modalVolList');
      document.getElementById('modalVolCount').innerText = dynamicVolunteers.length;

      const filtered = dynamicVolunteers.filter(v => v.name.toLowerCase().includes(q) || v.phone.replace(/[^0-9]/g, '').includes(q));

      if (filtered.length === 0) {
        container.innerHTML = '<div class="py-6 text-center text-slate-500 text-xs">검색 결과가 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(v => `
        <div class="flex items-center justify-between bg-slate-800/80 px-3 py-2 rounded-xl border border-slate-700/60 text-xs">
          <div class="flex items-center gap-2">
            <span class="font-bold text-white">${v.name}</span>
            <span class="text-slate-400 font-mono text-[11px]">${v.phone}</span>
          </div>
          <button onclick="deleteVolunteer(${v.id})" class="px-2 py-1 text-rose-400 hover:bg-rose-500/10 rounded-lg text-[11px] font-semibold transition border border-rose-500/20">
            삭제
          </button>
        </div>
      `).join('');
    }

    function addNewVolunteer() {
      const nameInput = document.getElementById('newVolName');
      const phoneInput = document.getElementById('newVolPhone');
      const name = nameInput.value.trim();
      const phone = phoneInput.value.trim();

      if (!name || !phone) {
        alert('이름과 휴대폰 번호를 모두 입력해 주세요.');
        return;
      }

      const newId = dynamicVolunteers.length > 0 ? Math.max(...dynamicVolunteers.map(v => v.id)) + 1 : 1;
      dynamicVolunteers.unshift({ id: newId, name: name, phone: phone });
      
      saveVolunteers();
      renderVolListInModal();
      updateTotalVolCount();

      nameInput.value = '';
      phoneInput.value = '';
      nameInput.focus();
    }

    function deleteVolunteer(id) {
      const target = dynamicVolunteers.find(v => v.id === id);
      if (confirm(`[${target.name}] 봉사자를 명단에서 완전히 삭제하시겠습니까?`)) {
        dynamicVolunteers = dynamicVolunteers.filter(v => v.id !== id);
        // 배정된 구역에서도 해당 봉사자 자동 제외
        zones.forEach(z => {
          z.assignedVols = z.assignedVols.filter(v => v.id !== id);
        });
        saveAssignments();
        saveVolunteers();
        renderVolListInModal();
        renderZoneGrid();
        updateTotalVolCount();
      }
    }

    function resetToDefaultVolunteers() {
      if (confirm('봉사자 명단을 초기 기본 73명으로 복원하시겠습니까?')) {
        dynamicVolunteers = [...defaultVolunteers];
        saveVolunteers();
        renderVolListInModal();
        updateTotalVolCount();
      }
    }

    function saveVolunteers() {
      localStorage.setItem('common_volunteer_list', JSON.stringify(dynamicVolunteers));
    }

    function unassignVolunteer(zoneId, volId) {
      const targetZone = zones.find(z => z.id === zoneId);
      const targetVol = targetZone.assignedVols.find(v => v.id === volId);
      if (confirm(`${targetZone.no}호 구역에서 [${targetVol.name}] 봉사자를 배정 제외하시겠습니까?`)) {
        targetZone.assignedVols = targetZone.assignedVols.filter(v => v.id !== volId);
        saveAssignments();
        renderZoneGrid();
      }
    }

    function resetAllData() {
      if (confirm('현재 배정된 모든 구역 내역을 초기화하시겠습니까?\n(등록된 봉사자 명단은 안전하게 유지됩니다)')) {
        zones.forEach(z => z.assignedVols = []);
        saveAssignments();
        renderZoneGrid();
      }
    }

    function saveAssignments() {
      const map = {};
      zones.forEach(z => {
        if (z.assignedVols.length > 0) map[z.id] = z.assignedVols;
      });
      localStorage.setItem('v6_zone_assignments', JSON.stringify(map));
    }

    function exportToCSV() {
      let csv = "\uFEFF구역번호,구역명칭,배정상태,배정인원수,담당봉사자,연락처,배정시각\n";
      
      zones.forEach(z => {
        if (z.assignedVols.length === 0) {
          csv += `"${z.no}","${z.name}","미배정","0","-","-","-"\n`;
        } else {
          z.assignedVols.forEach(v => {
            csv += `"${z.no}","${z.name}","배정완료","${z.assignedVols.length}","${v.name}","${v.phone}","${v.time || '-'}"\n`;
          });
        }
      });

      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `봉사구역_배정집계표_${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
