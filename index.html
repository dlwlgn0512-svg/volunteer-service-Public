<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>봉사 구역 다중 선택 배정기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 엑셀 파싱 라이브러리 (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <style>
    body { font-family: 'Pretendard', sans-serif; -webkit-tap-highlight-color: transparent; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24">

  <!-- 상단 네비게이션 -->
  <header class="bg-white border-b border-slate-200 px-4 py-3 sticky top-0 z-30 shadow-sm">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">인도자 현장 모드</span>
        <h1 class="text-base font-bold text-slate-900 mt-0.5">봉사 구역 일괄 배정기</h1>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-500 font-medium">출석:</span>
        <span id="todayCountBadge" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200">0명</span>
        <span class="text-xs text-slate-500 font-medium ml-1">배정:</span>
        <span id="assignedCountBadge" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg border border-blue-200">0명</span>
      </div>
    </div>
  </header>

  <main class="p-4 space-y-4 max-w-md mx-auto">

    <!-- 1단계: 당일 출석 체크 및 봉사자 엑셀 업로드/현장 추가 -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] flex items-center justify-center font-bold">1</span>
          오늘 참여자 체크 (<span id="totalPoolCount">0</span>명 중 선택)
        </label>
        <div class="flex items-center gap-1.5">
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
          <button onclick="document.getElementById('excelFileInput').click()" class="text-[11px] text-emerald-700 font-bold bg-emerald-50 hover:bg-emerald-100 px-2 py-1 rounded-lg border border-emerald-200 flex items-center gap-1 transition">
            <i data-lucide="file-spreadsheet" class="w-3 h-3"></i>
            <span>엑셀등록</span>
          </button>
          <button onclick="openAddModal()" class="text-[11px] text-blue-600 font-bold bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-lg border border-blue-200 flex items-center gap-1 transition">
            <i data-lucide="user-plus" class="w-3 h-3"></i>
            <span>추가</span>
          </button>
          <span class="text-slate-200 text-xs">|</span>
          <button onclick="clearTodayAttendance()" class="text-[11px] text-slate-400 hover:text-rose-500 transition">출석초기화</button>
        </div>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" id="attSearchInput" oninput="filterAttendancePool()" placeholder="봉사자 검색 (이름 또는 전화번호 뒷자리)" class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-1.5 max-h-40 overflow-y-auto pr-1 no-scrollbar" id="attendanceGrid"></div>
      <p class="text-[10px] text-slate-400 text-center">* 터치 시 출석 등록 / 톱니바퀴(⚙️) 터치 시 정보 수정·삭제</p>
    </section>

    <!-- 2단계: 오늘 참여자 중 배정할 인원 다중 선택 -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] flex items-center justify-center font-bold">2</span>
          배정할 참여자 선택 (<span id="selectedVolCountLabel" class="text-blue-600 font-bold">0명 선택됨</span>)
        </label>
        <div class="flex items-center gap-2">
          <button onclick="selectAllAvailableTodayVols()" class="text-[11px] text-blue-600 hover:underline">대기자 전체선택</button>
          <span class="text-slate-300 text-xs">|</span>
          <button onclick="clearSelectedVols()" class="text-[11px] text-slate-400 hover:underline">선택해제</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 max-h-44 overflow-y-auto pr-1 no-scrollbar" id="todayVolGrid"></div>
      <p class="text-[10px] text-slate-400 text-center">* 이미 배정된 참여자는 회색으로 잠겨 선택할 수 없습니다.</p>
    </section>

    <!-- 3단계: 구역카드 선택 (2열 그리드 + 팀 수 표기) -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] flex items-center justify-center font-bold">3</span>
          구역카드 선택 (<span id="zoneCountDisplay">131</span>개)
        </label>
        <span class="text-[11px] text-emerald-600 font-bold" id="selectedZoneLabel">1호 선택됨 (권장 1팀)</span>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" id="zoneSearchInput" oninput="filterZones()" placeholder="구역 번호나 명칭 검색 (예: 36, 안동국시)" class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-2 max-h-64 overflow-y-auto pr-1 no-scrollbar" id="zoneList"></div>
    </section>

    <!-- 배정 확정 버튼 -->
    <div>
      <button onclick="confirmMultipleAssignment()" id="btnConfirmAssign" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] rounded-2xl text-white font-bold text-sm shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 transition">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span id="assignBtnText">선택한 인원 배정 확정하기</span>
      </button>
      <p class="text-[10px] text-slate-400 text-center mt-2">
        * 배정 완료 후 아래 현황판에서 개별적으로 문자를 발송할 수 있습니다.
      </p>
    </div>

    <!-- 4단계: 실시간 배정 현황판 -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <i data-lucide="clipboard-check" class="w-4 h-4 text-blue-600"></i>
          구역별 배정 현황판 (<span id="assignedBoardCount">0</span>명 배정됨)
        </label>
        <button onclick="resetAllAssignments()" class="text-[11px] text-rose-500 hover:underline">배정 전체 초기화</button>
      </div>

      <div class="space-y-2.5 max-h-80 overflow-y-auto pr-1 no-scrollbar" id="assignedBoard"></div>
    </section>

  </main>

  <!-- 봉사자 현장 추가 모달창 -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
          <i data-lucide="user-plus" class="w-4 h-4 text-blue-600"></i>
          새 봉사자 직접 등록
        </h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="space-y-2.5">
        <div>
          <label class="text-[11px] font-medium text-slate-600 mb-1 block">이름</label>
          <input type="text" id="newVolName" placeholder="예: 홍길동" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-[11px] font-medium text-slate-600 mb-1 block">전화번호 (선택)</label>
          <input type="tel" id="newVolPhone" placeholder="예: 010-1234-5678 (비워둬도 됨)" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeAddModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition">취소</button>
        <button onclick="addNewVolunteer()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition shadow-md shadow-blue-600/20">등록 및 출석</button>
      </div>
    </div>
  </div>

  <!-- 봉사자 정보 수정 / 삭제 모달창 -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-900 flex items-center gap-1.5">
          <i data-lucide="user-cog" class="w-4 h-4 text-slate-700"></i>
          봉사자 정보 수정
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <input type="hidden" id="editVolId">
      <div class="space-y-2.5">
        <div>
          <label class="text-[11px] font-medium text-slate-600 mb-1 block">이름</label>
          <input type="text" id="editVolName" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="text-[11px] font-medium text-slate-600 mb-1 block">전화번호</label>
          <input type="tel" id="editVolPhone" placeholder="010-0000-0000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="flex flex-col gap-2 pt-1">
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold text-xs rounded-xl transition">취소</button>
          <button onclick="saveEditVolunteer()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-xl transition shadow-md shadow-blue-600/20">수정 완료</button>
        </div>
        <button onclick="deleteVolunteerPermanently()" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold text-xs rounded-xl transition border border-rose-200">
          이 봉사자 명단에서 완전히 삭제
        </button>
      </div>
    </div>
  </div>

    // 엑셀 파싱 및 업로드
    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

          if (rows.length === 0) {
            alert('엑셀 파일에 데이터가 없습니다.');
            return;
          }

          let newVolunteers = [];
          rows.forEach((row, idx) => {
            let name = row['이름'] || row['성명'] || row['봉사자'] || '';
            let phone = row['전화번호'] || row['연락처'] || row['휴대폰'] || row['핸드폰'] || row['전화'] || '';

            name = String(name).trim();
            phone = String(phone).trim();

            if (name) {
              newVolunteers.push({
                id: Date.now() + idx,
                name: name,
                phone: phone
              });
            }
          });

          if (newVolunteers.length === 0) {
            alert("엑셀에서 '이름' 열을 찾을 수 없습니다.\n첫 번째 줄에 '이름', '전화번호'라고 적혀 있는지 확인해 주세요.");
            return;
          }

          if (allVolunteers.length > 0) {
            if (confirm(`기존 명단(${allVolunteers.length}명)이 있습니다.\n[확인]: 기존 명단을 지우고 새 엑셀 명단(${newVolunteers.length}명)으로 교체\n[취소]: 기존 명단 뒤에 추가`)) {
              allVolunteers = newVolunteers;
            } else {
              allVolunteers = [...allVolunteers, ...newVolunteers];
            }
          } else {
            allVolunteers = newVolunteers;
          }

          localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));
          filteredPool = [...allVolunteers];
          document.getElementById('totalPoolCount').innerText = allVolunteers.length;

          renderAttendancePool();
          renderTodayVolGrid();
          alert(`총 ${newVolunteers.length}명의 봉사자 명단을 성공적으로 불러왔습니다!`);
        } catch (err) {
          alert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    // 1단계: 출석 풀 렌더링
    function renderAttendancePool() {
      const container = document.getElementById('attendanceGrid');
      if (filteredPool.length === 0) {
        container.innerHTML = `
          <div class="col-span-2 py-6 text-center text-xs text-slate-400 border border-dashed border-slate-200 rounded-xl">
            등록된 봉사자가 없습니다.<br>상단의 <b>[엑셀등록]</b> 버튼을 눌러 명단을 불러오세요.
          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filteredPool.map(v => {
        const isAttended = attendedIds.has(v.id);
        return `
          <div class="p-1.5 rounded-xl border transition flex items-center justify-between ${isAttended ? 'bg-blue-50 border-blue-400 text-blue-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'}">
            <button type="button" onclick="toggleAttendance(${v.id})" class="flex-1 text-left text-xs truncate flex items-center gap-1">
              <span class="truncate">${v.name}</span>
              ${isAttended ? '<i data-lucide="check" class="w-3.5 h-3.5 text-blue-600 shrink-0"></i>' : ''}
            </button>
            <button type="button" onclick="openEditModal(${v.id})" class="p-1 text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 rounded-md transition shrink-0 ml-1">
              <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function toggleAttendance(id) {
      if (attendedIds.has(id)) {
        attendedIds.delete(id);
        selectedVolIds.delete(id);
      } else {
        attendedIds.add(id);
      }
      localStorage.setItem('v6_attended_ids', JSON.stringify([...attendedIds]));
      renderAttendancePool();
      renderTodayVolGrid();
    }

    function clearTodayAttendance() {
      if (confirm('오늘 출석 체크를 모두 초기화하시겠습니까?')) {
        attendedIds.clear();
        selectedVolIds.clear();
        localStorage.removeItem('v6_attended_ids');
        renderAttendancePool();
        renderTodayVolGrid();
      }
    }

    // 모달: 신규 등록
    function openAddModal() {
      document.getElementById('addModal').classList.remove('hidden');
      document.getElementById('newVolName').focus();
    }

    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('newVolName').value = '';
      document.getElementById('newVolPhone').value = '';
    }

    function addNewVolunteer() {
      const name = document.getElementById('newVolName').value.trim();
      let phone = document.getElementById('newVolPhone').value.trim();

      if (!name) {
        alert('봉사자 이름을 입력해 주세요.');
        return;
      }

      const newId = Date.now();
      const newVol = { id: newId, name: name, phone: phone };

      allVolunteers.push(newVol);
      localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));

      filteredPool = [...allVolunteers];
      attendedIds.add(newId);
      localStorage.setItem('v6_attended_ids', JSON.stringify([...attendedIds]));

      document.getElementById('totalPoolCount').innerText = allVolunteers.length;
      closeAddModal();

      renderAttendancePool();
      renderTodayVolGrid();
      alert(`'${name}' 봉사자가 추가되었으며, 오늘 출석 명단에 자동 등록되었습니다.`);
    }

    // 모달: 수정 및 삭제
    function openEditModal(id) {
      const vol = allVolunteers.find(v => v.id === id);
      if (!vol) return;

      document.getElementById('editVolId').value = vol.id;
      document.getElementById('editVolName').value = vol.name;
      document.getElementById('editVolPhone').value = vol.phone || '';
      document.getElementById('editModal').classList.remove('hidden');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.add('hidden');
    }

    function saveEditVolunteer() {
      const id = Number(document.getElementById('editVolId').value);
      const name = document.getElementById('editVolName').value.trim();
      const phone = document.getElementById('editVolPhone').value.trim();

      if (!name) {
        alert('이름은 비워둘 수 없습니다.');
        return;
      }

      const vol = allVolunteers.find(v => v.id === id);
      if (vol) {
        vol.name = name;
        vol.phone = phone;

        zones.forEach(z => {
          z.assignedVols.forEach(av => {
            if (av.id === id) {
              av.name = name;
              av.phone = phone;
            }
          });
        });
        saveAssignments();

        localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));
        filteredPool = [...allVolunteers];
        closeEditModal();

        renderAttendancePool();
        renderTodayVolGrid();
        renderAssignedBoard();
        alert('정보가 정상적으로 수정되었습니다.');
      }
    }

    function deleteVolunteerPermanently() {
      const id = Number(document.getElementById('editVolId').value);
      const vol = allVolunteers.find(v => v.id === id);
      if (!vol) return;

      if (!confirm(`'${vol.name}' 봉사자를 전체 명단에서 완전히 삭제하시겠습니까?`)) {
        return;
      }

      allVolunteers = allVolunteers.filter(v => v.id !== id);
      localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));

      attendedIds.delete(id);
      selectedVolIds.delete(id);
      localStorage.setItem('v6_attended_ids', JSON.stringify([...attendedIds]));

      zones.forEach(z => {
        z.assignedVols = z.assignedVols.filter(av => av.id !== id);
      });
      saveAssignments();

      filteredPool = [...allVolunteers];
      document.getElementById('totalPoolCount').innerText = allVolunteers.length;
      closeEditModal();

      renderAttendancePool();
      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();
      alert('봉사자가 명단에서 삭제되었습니다.');
    }

    // 2단계: 오늘 참여자 그리드
    function renderTodayVolGrid() {
      const container = document.getElementById('todayVolGrid');
      document.getElementById('todayCountBadge').innerText = `${attendedIds.size}명`;

      const todayList = allVolunteers.filter(v => attendedIds.has(v.id));
      const assignedMap = getAssignedVolunteerMap();

      if (todayList.length === 0) {
        container.innerHTML = '<div class="col-span-2 py-4 text-center text-xs text-slate-400 italic">위 1단계에서 오늘 출석한 봉사자를 먼저 체크해 주세요.</div>';
        document.getElementById('selectedVolCountLabel').innerText = '0명 선택됨';
        updateAssignBtn();
        return;
      }

      container.innerHTML = todayList.map(v => {
        const isAssigned = assignedMap.has(v.id);
        const assignedZoneNo = assignedMap.get(v.id);
        const isChecked = selectedVolIds.has(v.id);
        const phoneTail = v.phone ? v.phone.slice(-4) : '번호없음';

        if (isAssigned) {
          return `
            <div class="p-2.5 rounded-xl border border-slate-200/80 bg-slate-100 text-slate-400 text-xs flex items-center justify-between opacity-60 cursor-not-allowed select-none">
              <div class="flex flex-col">
                <span class="font-medium line-through">${v.name}</span>
                <span class="text-[10px] text-slate-400 font-mono">${phoneTail}</span>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 font-bold">${assignedZoneNo}호 배정됨</span>
            </div>
          `;
        }

        return `
          <button type="button" onclick="toggleSelectVol(${v.id})" class="p-2.5 rounded-xl border text-left text-xs transition flex items-center justify-between ${isChecked ? 'bg-blue-600 text-white border-blue-600 font-bold shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-white'}">
            <div class="flex flex-col">
              <span>${v.name}</span>
              <span class="text-[10px] ${isChecked ? 'text-blue-200' : 'text-slate-400'} font-mono">${phoneTail}</span>
            </div>
            ${isChecked ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-white"></i>' : '<div class="w-4 h-4 rounded-full border border-slate-300 bg-white"></div>'}
          </button>
        `;
      }).join('');

      document.getElementById('selectedVolCountLabel').innerText = `${selectedVolIds.size}명 선택됨`;
      updateAssignBtn();
      lucide.createIcons();
    }

    function toggleSelectVol(id) {
      const assignedMap = getAssignedVolunteerMap();
      if (assignedMap.has(id)) return;

      if (selectedVolIds.has(id)) {
        selectedVolIds.delete(id);
      } else {
        selectedVolIds.add(id);
      }
      renderTodayVolGrid();
    }

    function selectAllAvailableTodayVols() {
      const assignedMap = getAssignedVolunteerMap();
      allVolunteers
        .filter(v => attendedIds.has(v.id) && !assignedMap.has(v.id))
        .forEach(v => selectedVolIds.add(v.id));
      renderTodayVolGrid();
    }

    function clearSelectedVols() {
      selectedVolIds.clear();
      renderTodayVolGrid();
    }

    function updateAssignBtn() {
      const count = selectedVolIds.size;
      const btnText = document.getElementById('assignBtnText');
      if (count === 0) {
        btnText.innerText = '배정할 인원을 선택해 주세요';
      } else {
        btnText.innerText = `선택한 ${count}명 배정 확정하기`;
      }
    }

    // 3단계: 구역 리스트 (팀 수 뱃지 추가)
    function renderZones() {
      const container = document.getElementById('zoneList');
      container.innerHTML = filteredZones.map(z => {
        const isSel = z.id === selectedZone.id;
        const count = z.assignedVols.length;
        return `
          <button type="button" onclick="selectZone(${z.id})" class="p-2.5 rounded-xl border text-left transition flex flex-col justify-between text-xs min-h-[68px] ${isSel ? 'bg-slate-900 text-white border-slate-900 shadow-md ring-2 ring-blue-500/20' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-white'}">
            <div class="flex items-center justify-between w-full">
              <div class="flex items-center gap-1.5">
                <span class="px-1.5 py-0.5 rounded font-mono font-bold text-[11px] ${isSel ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-800'}">${z.no}호</span>
                <span class="text-[10px] font-bold px-1.5 py-0.2 rounded-md ${isSel ? 'bg-blue-600/80 text-white' : 'bg-amber-100 text-amber-800'}">${z.teams}팀</span>
              </div>
              <div class="flex items-center gap-1">
                ${count > 0 ? `<span class="text-[9px] px-1.5 py-0.5 rounded-full bg-blue-100 text-blue-700 font-bold">${count}명</span>` : ''}
                ${isSel ? '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>' : ''}
              </div>
            </div>
            <div class="mt-1.5">
              <div class="font-bold truncate text-[11px] flex items-center gap-1">
                <span>${z.name}</span>
                ${z.isDev ? '<span class="text-[8px] px-1 rounded bg-rose-100 text-rose-600 font-bold shrink-0">재개발</span>' : ''}
              </div>
              <div class="text-[9px] ${isSel ? 'text-slate-300' : 'text-slate-400'} truncate mt-0.5">
                ${z.address}
              </div>
            </div>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function selectZone(id) {
      selectedZone = zones.find(z => z.id === id);
      document.getElementById('selectedZoneLabel').innerText = `${selectedZone.no}호 선택됨 (권장 ${selectedZone.teams}팀)`;
      renderZones();
    }

    // 다중 배정 확정
    function confirmMultipleAssignment() {
      if (selectedVolIds.size === 0) {
        alert('오늘 참여자 중 배정할 봉사자를 1명 이상 선택해 주세요.');
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let addedNames = [];

      selectedVolIds.forEach(volId => {
        const vol = allVolunteers.find(v => v.id === volId);
        selectedZone.assignedVols.push({
          id: vol.id,
          name: vol.name,
          phone: vol.phone,
          time: timeStr
        });
        addedNames.push(vol.name);
      });

      saveAssignments();
      selectedVolIds.clear();

      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();

      alert(`[배정 완료]\n${selectedZone.no}호 (${selectedZone.name})\n👉 ${addedNames.join(', ')} (${addedNames.length}명) 등록 완료!\n* 배정된 참여자는 대기자 목록에서 자동 잠금됩니다.`);
    }

    // 4단계 현황판 렌더링 (팀 수 함께 표기)
    function renderAssignedBoard() {
      const container = document.getElementById('assignedBoard');
      const activeZones = zones.filter(z => z.assignedVols.length > 0);
      
      const totalAssignedPeople = zones.reduce((acc, z) => acc + z.assignedVols.length, 0);
      document.getElementById('assignedCountBadge').innerText = `${totalAssignedPeople}명`;
      document.getElementById('assignedBoardCount').innerText = `${totalAssignedPeople}`;

      if (activeZones.length === 0) {
        container.innerHTML = `
          <div class="py-8 text-center text-slate-400 text-xs border border-dashed border-slate-200 rounded-xl">
            아직 배정된 인원이 없습니다.<br>위에서 참여자(들)와 구역을 선택하고 [배정 확정하기]를 누르세요.
          </div>
        `;
        return;
      }

      container.innerHTML = activeZones.map(z => `
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl space-y-2">
          <div class="flex items-center justify-between border-b border-slate-200/80 pb-2">
            <div class="flex flex-col">
              <div class="flex items-center gap-1.5">
                <span class="px-2 py-0.5 bg-slate-900 text-white font-mono font-bold rounded-md text-[11px]">${z.no}호</span>
                <span class="text-xs font-bold text-slate-800">${z.name}</span>
                <span class="text-[10px] font-bold px-1.5 py-0.2 rounded bg-amber-100 text-amber-800">${z.teams}팀 구역</span>
              </div>
              <span class="text-[10px] text-slate-500 mt-0.5">📍 ${z.address}</span>
            </div>
            <span class="text-[10px] font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full border border-blue-100 shrink-0">${z.assignedVols.length}명 배정</span>
          </div>

          <div class="space-y-1.5 pt-0.5">
            ${z.assignedVols.map(v => `
              <div class="flex items-center justify-between bg-white p-2 rounded-lg border border-slate-100 text-xs">
                <div class="flex items-center gap-1.5">
                  <span class="font-bold text-slate-800">${v.name}</span>
                  <span class="text-slate-400 text-[10px] font-mono">${v.phone ? `(${v.phone.slice(-4)})` : '(번호없음)'}</span>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick="sendIndividualSMS('${v.phone || ''}', '${z.no}', '${z.name}', '${z.address}')" class="px-2 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-lg text-[10px] font-bold border border-emerald-200 flex items-center gap-1 transition">
                    <i data-lucide="message-square" class="w-3 h-3"></i>
                    <span>문자</span>
                  </button>
                  <button onclick="removeVolunteerFromZone(${z.id}, ${v.id})" class="px-2 py-1 text-slate-400 hover:text-rose-500 rounded-lg text-[10px] transition">
                    삭제
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function sendIndividualSMS(phone, zoneNo, zoneName, fullAddr) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const messageBody = `[봉사 구역 배정 안내]
안녕하세요! 오늘 배정된 봉사 구역 안내드립니다.

* 배정 구역: ${zoneNo}호 - ${zoneName}
* 현장 주소: ${fullAddr}

오늘도 즐거운 봉사 되세요~`;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const sep = isIOS ? '&' : '?';

      if (!cleanPhone) {
        window.location.href = `sms:${sep}body=${encodeURIComponent(messageBody)}`;
      } else {
        window.location.href = `sms:${cleanPhone}${sep}body=${encodeURIComponent(messageBody)}`;
      }
    }

    function removeVolunteerFromZone(zoneId, volId) {
      const z = zones.find(item => item.id === zoneId);
      z.assignedVols = z.assignedVols.filter(v => v.id !== volId);
      saveAssignments();
      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();
    }

    function resetAllAssignments() {
      if (confirm('현재 배정된 모든 구역 현황을 초기화하시겠습니까?')) {
        zones.forEach(z => z.assignedVols = []);
        saveAssignments();
        renderTodayVolGrid();
        renderZones();
        renderAssignedBoard();
      }
    }

    function saveAssignments() {
      const map = {};
      zones.forEach(z => {
        if (z.assignedVols.length > 0) map[z.id] = z.assignedVols;
      });
      localStorage.setItem('v6_zone_assignments', JSON.stringify(map));
    }

    function filterAttendancePool() {
      const q = document.getElementById('attSearchInput').value.trim().toLowerCase();
      filteredPool = allVolunteers.filter(v => v.name.toLowerCase().includes(q) || v.phone.replace(/[^0-9]/g, '').includes(q));
      renderAttendancePool();
    }

    function filterZones() {
      const q = document.getElementById('zoneSearchInput').value.trim().toLowerCase();
      filteredZones = zones.filter(z => z.no.toLowerCase().includes(q) || z.name.toLowerCase().includes(q) || z.address.toLowerCase().includes(q));
      renderZones();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
