<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>봉사 구역 다중 선택 배정기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- 엑셀 파싱 라이브러리 (SheetJS) -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  
  <style>
    :root {
      --fluid-h1: clamp(0.95rem, 4.2vw, 1.15rem);
      --fluid-title: clamp(0.78rem, 3.4vw, 0.92rem);
      --fluid-body: clamp(0.70rem, 2.9vw, 0.82rem);
      --fluid-sub: clamp(0.60rem, 2.4vw, 0.72rem);
      --fluid-badge: clamp(0.55rem, 2.2vw, 0.68rem);
    }

    body { 
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; 
      -webkit-tap-highlight-color: transparent; 
      word-break: keep-all;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .f-h1 { font-size: var(--fluid-h1); line-height: 1.3; }
    .f-title { font-size: var(--fluid-title); line-height: 1.35; }
    .f-body { font-size: var(--fluid-body); line-height: 1.4; }
    .f-sub { font-size: var(--fluid-sub); line-height: 1.3; }
    .f-badge { font-size: var(--fluid-badge); line-height: 1.2; }

    .fluid-btn-p {
      padding: clamp(0.35rem, 1.6vw, 0.55rem) clamp(0.35rem, 1.8vw, 0.6rem);
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen pb-24">

  <!-- 상단 네비게이션 -->
  <header class="bg-white border-b border-slate-200 px-3 py-2.5 sticky top-0 z-30 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <span class="f-badge font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-full">인도자 현장 모드</span>
        <h1 class="f-h1 font-bold text-slate-900 mt-0.5">봉사 구역 일괄 배정기</h1>
      </div>
      <div class="flex items-center gap-1.5 shrink-0">
        <span class="f-sub text-slate-500 font-medium">출석:</span>
        <span id="todayCountBadge" class="f-sub font-bold text-emerald-600 bg-emerald-50 px-1.5 py-0.5 rounded-md border border-emerald-200">0명</span>
        <span class="f-sub text-slate-500 font-medium ml-0.5">배정:</span>
        <span id="assignedCountBadge" class="f-sub font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded-md border border-blue-200">0명</span>
      </div>
    </div>
  </header>

  <main class="p-3 space-y-3 max-w-md mx-auto">

    <!-- 1단계: 당일 출석 체크 (엔터키 자동 선택 기능 탑재) -->
    <section class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="f-title font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] flex items-center justify-center font-bold">1</span>
          참여자 출석 (<span id="totalPoolCount">0</span>명)
        </label>
        <div class="flex items-center gap-1 shrink-0">
          <input type="file" id="excelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleExcelUpload(event)">
          <button onclick="document.getElementById('excelFileInput').click()" class="f-sub text-emerald-700 font-bold bg-emerald-50 hover:bg-emerald-100 px-2 py-1 rounded-lg border border-emerald-200 flex items-center gap-1 transition">
            <i data-lucide="file-spreadsheet" class="w-3 h-3"></i>
            <span>엑셀등록</span>
          </button>
          <button onclick="openAddModal()" class="f-sub text-blue-600 font-bold bg-blue-50 hover:bg-blue-100 px-1.5 py-1 rounded-lg border border-blue-200 flex items-center gap-0.5 transition">
            <i data-lucide="user-plus" class="w-3 h-3"></i>
            <span>추가</span>
          </button>
          <span class="text-slate-200 text-xs">|</span>
          <button onclick="clearTodayAttendance()" class="f-sub text-slate-400 hover:text-rose-500 transition">초기화</button>
        </div>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" id="attSearchInput" oninput="filterAttendancePool()" onkeydown="handleSearchKeyDown(event)" placeholder="이름 입력 후 Enter 누르면 자동 선택" class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl f-body focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-3 gap-1.5 max-h-48 overflow-y-auto pr-0.5 no-scrollbar" id="attendanceGrid"></div>
      <p class="f-badge text-slate-400 text-center">* 이름 검색 후 [Enter] 누르면 즉시 선택 / ⚙️: 정보 수정·삭제</p>
    </section>

    <!-- 2단계: 오늘 참여자 중 배정할 인원 다중 선택 (배정 인원 빨간색 블록) -->
    <section class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="f-title font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] flex items-center justify-center font-bold">2</span>
          배정 참여자 선택 (<span id="selectedVolCountLabel" class="text-blue-600 font-bold">0명</span>)
        </label>
        <div class="flex items-center gap-1 shrink-0">
          <button onclick="selectAllAvailableTodayVols()" class="f-sub text-blue-600 hover:underline">대기자</button>
          <span class="text-slate-300 text-xs">|</span>
          <button onclick="clearSelectedVols()" class="f-sub text-slate-400 hover:underline">해제</button>
          <span class="text-slate-300 text-xs">|</span>
          <button onclick="unassignSelectedVolunteers()" class="f-sub font-bold text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-1.5 py-0.5 rounded border border-rose-200 transition flex items-center gap-0.5">
            <i data-lucide="user-x" class="w-3 h-3"></i>
            <span>배정해제</span>
          </button>
        </div>
      </div>

      <div class="grid grid-cols-3 gap-1.5 max-h-48 overflow-y-auto pr-0.5 no-scrollbar" id="todayVolGrid"></div>
      <p class="f-badge text-slate-400 text-center">* 붉은색 블록은 이미 배정된 인원입니다. 터치 후 [배정해제] 가능</p>
    </section>

    <!-- 3단계: 구역카드 선택 -->
    <section class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="f-title font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] flex items-center justify-center font-bold">3</span>
          구역카드 선택 (<span id="zoneCountDisplay">131</span>개)
        </label>
        <div class="flex items-center gap-1 shrink-0">
          <input type="file" id="zoneExcelFileInput" accept=".xlsx, .xls" class="hidden" onchange="handleZoneExcelUpload(event)">
          <button onclick="document.getElementById('zoneExcelFileInput').click()" class="f-sub text-blue-700 font-bold bg-blue-50 hover:bg-blue-100 px-2 py-1 rounded-lg border border-blue-200 flex items-center gap-1 transition">
            <i data-lucide="file-spreadsheet" class="w-3 h-3"></i>
            <span>구역 엑셀등록</span>
          </button>
          <span class="text-slate-200 text-xs">|</span>
          <button onclick="resetZoneData()" class="f-sub text-slate-400 hover:text-rose-500 transition">구역초기화</button>
        </div>
      </div>

      <div class="flex items-center justify-between px-1">
        <span class="f-sub text-emerald-600 font-bold truncate max-w-[280px]" id="selectedZoneLabel">1호 선택됨 (권장 1팀)</span>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" id="zoneSearchInput" oninput="filterZones()" placeholder="구역 번호나 명칭, 주소 검색" class="w-full pl-8 pr-3 py-1.5 bg-slate-50 border border-slate-200 rounded-xl f-body focus:outline-none focus:border-emerald-500">
      </div>

      <div class="grid grid-cols-2 gap-1.5 max-h-64 overflow-y-auto pr-0.5 no-scrollbar" id="zoneList"></div>
    </section>

    <!-- 배정 확정 버튼 -->
    <div>
      <button onclick="confirmMultipleAssignment()" id="btnConfirmAssign" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] rounded-2xl text-white font-bold f-title shadow-md shadow-blue-600/20 flex items-center justify-center gap-2 transition">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span id="assignBtnText">선택한 인원 배정 확정하기</span>
      </button>
      <p class="f-badge text-slate-400 text-center mt-1.5">
        * 배정 완료 후 아래 현황판에서 개별적으로 문자를 발송할 수 있습니다.
      </p>
    </div>

    <!-- 4단계: 실시간 배정 현황판 -->
    <section class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-xs space-y-3">
      <div class="flex items-center justify-between">
        <label class="f-title font-bold text-slate-800 flex items-center gap-1.5">
          <i data-lucide="clipboard-check" class="w-4 h-4 text-blue-600"></i>
          구역별 현황판 (<span id="assignedBoardCount">0</span>명 배정됨)
        </label>
        <button onclick="resetAllAssignments()" class="f-sub text-rose-500 hover:underline">전체 초기화</button>
      </div>

      <div class="space-y-2 max-h-80 overflow-y-auto pr-0.5 no-scrollbar" id="assignedBoard"></div>
    </section>

  </main>

  <!-- 봉사자 추가 모달창 -->
  <div id="addModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="f-title font-bold text-slate-900 flex items-center gap-1.5">
          <i data-lucide="user-plus" class="w-4 h-4 text-blue-600"></i>
          새 봉사자 직접 등록
        </h3>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="space-y-2.5">
        <div>
          <label class="f-sub font-medium text-slate-600 mb-1 block">이름</label>
          <input type="text" id="newVolName" placeholder="예: 홍길동" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl f-body focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="f-sub font-medium text-slate-600 mb-1 block">전화번호 (선택)</label>
          <input type="tel" id="newVolPhone" placeholder="010-1234-5678" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl f-body focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="flex gap-2 pt-1">
        <button onclick="closeAddModal()" class="flex-1 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold f-sub rounded-xl transition">취소</button>
        <button onclick="addNewVolunteer()" class="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold f-sub rounded-xl transition shadow-md shadow-blue-600/20">등록 및 출석</button>
      </div>
    </div>
  </div>

  <!-- 봉사자 수정/삭제 모달창 -->
  <div id="editModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl p-5 w-full max-w-xs shadow-2xl border border-slate-100 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="f-title font-bold text-slate-900 flex items-center gap-1.5">
          <i data-lucide="user-cog" class="w-4 h-4 text-slate-700"></i>
          봉사자 정보 수정
        </h3>
        <button onclick="closeEditModal()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <input type="hidden" id="editVolId">
      <div class="space-y-2.5">
        <div>
          <label class="f-sub font-medium text-slate-600 mb-1 block">이름</label>
          <input type="text" id="editVolName" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl f-body focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="f-sub font-medium text-slate-600 mb-1 block">전화번호</label>
          <input type="tel" id="editVolPhone" placeholder="010-0000-0000" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl f-body focus:outline-none focus:border-blue-500">
        </div>
      </div>
      <div class="flex flex-col gap-2 pt-1">
        <div class="flex gap-2">
          <button onclick="closeEditModal()" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold f-sub rounded-xl transition">취소</button>
          <button onclick="saveEditVolunteer()" class="flex-1 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold f-sub rounded-xl transition shadow-md shadow-blue-600/20">수정 완료</button>
        </div>
        <button onclick="deleteVolunteerPermanently()" class="w-full py-2 bg-rose-50 hover:bg-rose-100 text-rose-600 font-bold f-sub rounded-xl transition border border-rose-200">
          명단에서 완전히 삭제
        </button>
      </div>
    </div>
  </div>

    // 구역 엑셀 파일 업로드
    function handleZoneExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

          if (!rows || rows.length === 0) {
            alert('엑셀 파일에 데이터가 없습니다.');
            return;
          }

          let headerRowIdx = -1;
          let noColIdx = -1;
          let nameColIdx = -1;
          let addrColIdx = -1;
          let teamColIdx = -1;

          for (let r = 0; r < Math.min(rows.length, 10); r++) {
            const row = rows[r];
            if (!Array.isArray(row)) continue;
            for (let c = 0; c < row.length; c++) {
              const cellStr = String(row[c]).trim().replace(/\s+/g, '');
              if (cellStr.includes('카드번호') || cellStr.includes('구역번호') || cellStr === '번호') {
                noColIdx = c;
              }
              if (cellStr.includes('구역이름') || cellStr.includes('구역명') || cellStr === '명칭') {
                nameColIdx = c;
              }
              if (cellStr.includes('주소') || cellStr.includes('도로명') || cellStr.includes('위치')) {
                addrColIdx = c;
              }
              if (cellStr.includes('팀수') || cellStr.includes('팀')) {
                teamColIdx = c;
              }
            }
            if (noColIdx !== -1 && nameColIdx !== -1) {
              headerRowIdx = r;
              break;
            }
          }

          if (headerRowIdx === -1) {
            alert("엑셀에서 구역 번호 또는 구역 이름을 찾을 수 없습니다.");
            return;
          }

          let newRawZones = [];
          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row || !Array.isArray(row)) continue;

            let zNo = String(row[noColIdx] || '').trim();
            let zName = String(row[nameColIdx] || '').trim();
            let zAddr = addrColIdx !== -1 ? String(row[addrColIdx] || '').trim() : '';
            let zTeams = teamColIdx !== -1 ? Number(row[teamColIdx]) || 1 : 1;

            if (!zNo || !zName || zNo === '카드번호' || zNo === '구역번호') continue;

            newRawZones.push([zNo, zName, zAddr, zTeams]);
          }

          if (newRawZones.length === 0) {
            alert("불러올 구역 데이터가 없습니다.");
            return;
          }

          localStorage.setItem('v6_custom_zones', JSON.stringify(newRawZones));
          localStorage.removeItem('v6_zone_assignments');

          zones = newRawZones.map((item, idx) => ({
            id: idx + 1,
            no: String(item[0]),
            name: String(item[1]),
            address: String(item[2] || ''),
            teams: Number(item[3]) || 1,
            isDev: String(item[0]).includes('(X)') || String(item[2] || '').includes('재개발'),
            assignedVols: []
          }));

          filteredZones = [...zones];
          selectedZone = zones[0] || null;
          document.getElementById('zoneCountDisplay').innerText = zones.length;

          renderTodayVolGrid();
          renderZones();
          renderAssignedBoard();
          alert(`새로운 구역 ${zones.length}개를 성공적으로 불러왔습니다!`);
        } catch (err) {
          alert('구역 엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

    // 봉사자 엑셀 파일 업로드
    function handleExcelUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const firstSheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[firstSheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });

          if (!rows || rows.length === 0) {
            alert('엑셀 파일에 데이터가 없습니다.');
            return;
          }

          let headerRowIdx = -1;
          let nameColIdx = -1;
          let phoneColIdx = -1;

          for (let r = 0; r < Math.min(rows.length, 10); r++) {
            const row = rows[r];
            if (!Array.isArray(row)) continue;
            for (let c = 0; c < row.length; c++) {
              const cellStr = String(row[c]).trim().replace(/\s+/g, '');
              if (cellStr === '이름' || cellStr === '성명' || cellStr === '봉사자') {
                headerRowIdx = r;
                nameColIdx = c;
              }
              if (cellStr.includes('전화') || cellStr.includes('연락처') || cellStr.includes('휴대폰') || cellStr.includes('핸드폰')) {
                phoneColIdx = c;
              }
            }
            if (headerRowIdx !== -1) break;
          }

          if (headerRowIdx === -1 || nameColIdx === -1) {
            alert("엑셀에서 '이름' 열을 찾을 수 없습니다.");
            return;
          }

          let newVolunteers = [];
          for (let r = headerRowIdx + 1; r < rows.length; r++) {
            const row = rows[r];
            if (!row || !Array.isArray(row)) continue;

            let name = String(row[nameColIdx] || '').trim();
            let phone = phoneColIdx !== -1 ? String(row[phoneColIdx] || '').trim() : '';

            if (!name || name === '이름' || name === '성명') continue;

            newVolunteers.push({
              id: Date.now() + r,
              name: name,
              phone: phone
            });
          }

          allVolunteers = newVolunteers;
          localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));

          attendedIds.clear();
          selectedVolIds.clear();
          localStorage.removeItem('v6_attended_ids');

          filteredPool = [...allVolunteers];
          document.getElementById('totalPoolCount').innerText = allVolunteers.length;

          renderAttendancePool();
          renderTodayVolGrid();
          alert(`새로운 봉사자 ${newVolunteers.length}명으로 명단을 덮어썼습니다!`);
        } catch (err) {
          alert('엑셀 파일을 읽는 중 오류가 발생했습니다: ' + err.message);
        }
      };
      reader.readAsArrayBuffer(file);
      event.target.value = '';
    }

          </div>
        `;
        lucide.createIcons();
        return;
      }

      container.innerHTML = filteredPool.map(v => {
        const isAttended = attendedIds.has(v.id);
        return `
          <div class="fluid-btn-p rounded-xl border transition flex items-center justify-between min-w-0 ${isAttended ? 'bg-blue-50 border-blue-400 text-blue-900 font-bold shadow-2xs' : 'bg-slate-50 border-slate-200 text-slate-700'}">
            <button type="button" onclick="toggleAttendance(${v.id})" class="flex-1 text-left f-body truncate flex items-center gap-0.5 overflow-hidden">
              <span class="truncate">${v.name}</span>
              ${isAttended ? '<i data-lucide="check" class="w-3 h-3 text-blue-600 shrink-0"></i>' : ''}
            </button>
            <button type="button" onclick="openEditModal(${v.id})" class="p-0.5 text-slate-400 hover:text-slate-700 rounded transition shrink-0 ml-0.5">
              <i data-lucide="settings-2" class="w-3 h-3"></i>
            </button>
          </div>
        `;
      }).join('');

    function openEditModal(id) {

      if (!vol) return;

      document.getElementById('editVolId').value = vol.id;
      document.getElementById('editVolName').value = vol.name;
      document.getElementById('editVolPhone').value = vol.phone || '';
      document.getElementById('editModal').classList.remove('hidden');

    function saveEditVolunteer() {
      const id = Number(document.getElementById('editVolId').value);
      const name = document.getElementById('editVolName').value.trim();
      const phone = document.getElementById('editVolPhone').value.trim();

      if (!name) {
        alert('이름은 비워둘 수 없습니다.');
        return;
      }

      const vol = allVolunteers.find(v => v.id === id);
      if (vol) {
        vol.name = name;
        vol.phone = phone;

        zones.forEach(z => {
          z.assignedVols.forEach(av => {
            if (av.id === id) {
              av.name = name;
              av.phone = phone;
            }
          });
        });
        saveAssignments();

        localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));
        filteredPool = [...allVolunteers];
        closeEditModal();

        renderAttendancePool();
        renderTodayVolGrid();
        renderAssignedBoard();
        alert('정보가 정상적으로 수정되었습니다.');
      }
    }

    function deleteVolunteerPermanently() {
      const id = Number(document.getElementById('editVolId').value);
      const vol = allVolunteers.find(v => v.id === id);
      if (!vol) return;

      if (!confirm(`'${vol.name}' 봉사자를 전체 명단에서 완전히 삭제하시겠습니까?`)) {
        return;
      }

      allVolunteers = allVolunteers.filter(v => v.id !== id);
      localStorage.setItem('v6_secure_volunteers', JSON.stringify(allVolunteers));

      attendedIds.delete(id);
      selectedVolIds.delete(id);
      localStorage.setItem('v6_attended_ids', JSON.stringify([...attendedIds]));

      zones.forEach(z => {
        z.assignedVols = z.assignedVols.filter(av => av.id !== id);
      });
      saveAssignments();

      filteredPool = [...allVolunteers];
      document.getElementById('totalPoolCount').innerText = allVolunteers.length;
      closeEditModal();

      renderAttendancePool();
      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();
      alert('봉사자가 명단에서 삭제되었습니다.');
    }

    function renderTodayVolGrid() {
      const container = document.getElementById('todayVolGrid');
      document.getElementById('todayCountBadge').innerText = `${attendedIds.size}명`;

      const todayList = allVolunteers.filter(v => attendedIds.has(v.id));
      const assignedMap = getAssignedVolunteerMap();

      if (todayList.length === 0) {
        container.innerHTML = '<div class="col-span-3 py-4 text-center f-sub text-slate-400 italic">위 1단계에서 오늘 출석한 봉사자를 먼저 체크해 주세요.</div>';
        document.getElementById('selectedVolCountLabel').innerText = '0명';
        updateAssignBtn();
        return;
      }

      container.innerHTML = todayList.map(v => {
        const isAssigned = assignedMap.has(v.id);
        const assignedZoneNo = assignedMap.get(v.id);
        const isChecked = selectedVolIds.has(v.id);
        const phoneTail = v.phone ? v.phone.slice(-4) : '번호없음';

        if (isAssigned) {
          // [핵심] 이미 배정된 인원: 뚜렷한 연빨강 배경(bg-rose-100/border-rose-300)과 빨간 뱃지
          return `
            <button type="button" onclick="toggleSelectVol(${v.id})" class="p-1.5 rounded-xl border text-left transition flex flex-col justify-between min-w-0 ${isChecked ? 'bg-rose-500 text-white border-rose-600 shadow-xs' : 'bg-rose-100/90 text-rose-950 border-rose-300 hover:border-rose-400'}">
              <div class="flex items-center justify-between w-full">
                <span class="f-body truncate ${isChecked ? 'text-white font-bold' : 'text-rose-950 font-bold'}">${v.name}</span>
                ${isChecked ? '<i data-lucide="check" class="w-3.5 h-3.5 text-white shrink-0"></i>' : '<span class="f-badge px-1 py-0.2 rounded bg-rose-200/90 text-rose-800 font-bold shrink-0">${assignedZoneNo}호</span>'}
              </div>
              <div class="flex items-center justify-between w-full mt-1">
                <span class="f-badge ${isChecked ? 'text-rose-100' : 'text-rose-700'} font-mono truncate">${phoneTail}</span>
                ${isChecked ? `<span class="f-badge px-1 py-0.2 rounded bg-rose-700 text-white font-bold shrink-0">${assignedZoneNo}호</span>` : ''}
              </div>
            </button>
          `;
        }

        return `
          <button type="button" onclick="toggleSelectVol(${v.id})" class="p-1.5 rounded-xl border text-left transition flex flex-col justify-between min-w-0 ${isChecked ? 'bg-blue-600 text-white border-blue-600 font-bold shadow-xs' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-white'}">
            <div class="flex items-center justify-between w-full">
              <span class="f-body truncate font-medium">${v.name}</span>
              ${isChecked ? '<i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-white shrink-0"></i>' : '<div class="w-3 h-3 rounded-full border border-slate-300 bg-white shrink-0"></div>'}
            </div>
            <div class="mt-1">
              <span class="f-badge ${isChecked ? 'text-blue-200' : 'text-slate-400'} font-mono">${phoneTail}</span>
            </div>
          </button>
        `;
      }).join('');

      document.getElementById('selectedVolCountLabel').innerText = `${selectedVolIds.size}명`;
      updateAssignBtn();
      lucide.createIcons();
    }

    function toggleSelectVol(id) {
      if (selectedVolIds.has(id)) {
        selectedVolIds.delete(id);
      } else {
        selectedVolIds.add(id);
      }
      renderTodayVolGrid();
    }

    function selectAllAvailableTodayVols() {
      const assignedMap = getAssignedVolunteerMap();
      allVolunteers
        .filter(v => attendedIds.has(v.id) && !assignedMap.has(v.id))
        .forEach(v => selectedVolIds.add(v.id));
      renderTodayVolGrid();
    }

    function clearSelectedVols() {
      selectedVolIds.clear();
      renderTodayVolGrid();
    }

    function unassignSelectedVolunteers() {
      if (selectedVolIds.size === 0) {
        alert('배정을 해제할 참여자를 먼저 선택해 주세요.');
        return;
      }

      let unassignedCount = 0;

      zones.forEach(z => {
        const originalLen = z.assignedVols.length;
        z.assignedVols = z.assignedVols.filter(v => !selectedVolIds.has(v.id));
        unassignedCount += (originalLen - z.assignedVols.length);
      });

      if (unassignedCount === 0) {
        alert('선택된 인원 중 현재 배정된 구역이 있는 인원이 없습니다.');
        return;
      }

      saveAssignments();
      selectedVolIds.clear();

      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();

      alert(`선택된 참여자 중 배정되어 있던 ${unassignedCount}명의 배정이 정상적으로 해제되었습니다.`);
    }

    function updateAssignBtn() {
      const count = selectedVolIds.size;
      const btnText = document.getElementById('assignBtnText');
      if (count === 0) {
        btnText.innerText = '배정할 인원을 선택해 주세요';
      } else {
        btnText.innerText = `선택한 ${count}명 배정 확정하기`;
      }
    }

    function renderZones() {
      const container = document.getElementById('zoneList');
      container.innerHTML = filteredZones.map(z => {
        const isSel = selectedZone && z.id === selectedZone.id;
        const count = z.assignedVols.length;
        return `
          <button type="button" onclick="selectZone(${z.id})" class="p-2 rounded-xl border text-left transition flex flex-col justify-between min-h-[64px] min-w-0 ${isSel ? 'bg-slate-900 text-white border-slate-900 shadow-md ring-2 ring-blue-500/20' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-white'}">
            <div class="flex items-center justify-between w-full">
              <div class="flex items-center gap-1 min-w-0">
                <span class="f-sub px-1 py-0.2 rounded font-mono font-bold shrink-0 ${isSel ? 'bg-emerald-500 text-white' : 'bg-slate-200 text-slate-800'}">${z.no}호</span>
                <span class="f-badge font-bold px-1 py-0.2 rounded shrink-0 ${isSel ? 'bg-blue-600/80 text-white' : 'bg-amber-100 text-amber-800'}">${z.teams}팀</span>
              </div>
              <div class="flex items-center gap-0.5 shrink-0 ml-1">
                ${count > 0 ? `<span class="f-badge px-1 py-0.2 rounded-full bg-blue-100 text-blue-700 font-bold shrink-0">${count}명</span>` : ''}
                ${isSel ? '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400 shrink-0"></i>' : ''}
              </div>
            </div>
            <div class="mt-1 min-w-0">
              <div class="font-bold truncate f-body flex items-center gap-1">
                <span class="truncate">${z.name}</span>
                ${z.isDev ? '<span class="f-badge px-1 rounded bg-rose-100 text-rose-600 font-bold shrink-0">재개발</span>' : ''}
              </div>
              <div class="f-badge ${isSel ? 'text-slate-300' : 'text-slate-400'} truncate mt-0.5">
                ${z.address}
              </div>
            </div>
          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function selectZone(id) {
      selectedZone = zones.find(z => z.id === id);
      if (selectedZone) {
        document.getElementById('selectedZoneLabel').innerText = `${selectedZone.no}호 (권장 ${selectedZone.teams}팀)`;
      }
      renderZones();
    }

    function confirmMultipleAssignment() {
      if (!selectedZone) {
        alert('배정할 구역카드를 먼저 선택해 주세요.');
        return;
      }
      if (selectedVolIds.size === 0) {
        alert('오늘 참여자 중 배정할 봉사자를 1명 이상 선택해 주세요.');
        return;
      }

      const assignedMap = getAssignedVolunteerMap();
      const reassignNames = [];
      selectedVolIds.forEach(id => {
        if (assignedMap.has(id)) {
          const v = allVolunteers.find(item => item.id === id);
          if (v) reassignNames.push(`${v.name}(기존 ${assignedMap.get(id)}호)`);
        }
      });

      if (reassignNames.length > 0) {
        if (!confirm(`이미 다른 구역에 배정된 인원이 포함되어 있습니다:\n- ${reassignNames.join(', ')}\n\n해당 인원을 기존 구역에서 해제하고 '${selectedZone.no}호'로 이동 배정하시겠습니까?`)) {
          return;
        }
        zones.forEach(z => {
          z.assignedVols = z.assignedVols.filter(v => !selectedVolIds.has(v.id));
        });
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let addedNames = [];

      selectedVolIds.forEach(volId => {
        const vol = allVolunteers.find(v => v.id === volId);
        selectedZone.assignedVols.push({
          id: vol.id,
          name: vol.name,
          phone: vol.phone,
          time: timeStr
        });
        addedNames.push(vol.name);
      });

      saveAssignments();
      selectedVolIds.clear();

      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();

      alert(`[배정 완료]\n${selectedZone.no}호 (${selectedZone.name})\n👉 ${addedNames.join(', ')} (${addedNames.length}명) 등록 완료!`);
    }

    function renderAssignedBoard() {
      const container = document.getElementById('assignedBoard');
      const activeZones = zones.filter(z => z.assignedVols.length > 0);
      
      const totalAssignedPeople = zones.reduce((acc, z) => acc + z.assignedVols.length, 0);
      document.getElementById('assignedCountBadge').innerText = `${totalAssignedPeople}명`;
      document.getElementById('assignedBoardCount').innerText = `${totalAssignedPeople}`;

      if (activeZones.length === 0) {
        container.innerHTML = `
          <div class="py-6 text-center text-slate-400 f-sub border border-dashed border-slate-200 rounded-xl">
            아직 배정된 인원이 없습니다.<br>위에서 참여자(들)와 구역을 선택하고 [배정 확정하기]를 누르세요.
          </div>
        `;
        return;
      }

      container.innerHTML = activeZones.map(z => `
        <div class="p-2.5 bg-slate-50 border border-slate-200 rounded-xl space-y-1.5">
          <div class="flex items-center justify-between border-b border-slate-200/80 pb-1.5">
            <div class="flex flex-col min-w-0">
              <div class="flex items-center gap-1">
                <span class="px-1.5 py-0.2 bg-slate-900 text-white font-mono font-bold rounded f-sub">${z.no}호</span>
                <span class="f-body font-bold text-slate-800 truncate">${z.name}</span>
                <span class="f-badge font-bold px-1 rounded bg-amber-100 text-amber-800 shrink-0">${z.teams}팀</span>
              </div>
              <span class="f-badge text-slate-500 mt-0.5 truncate">📍 ${z.address}</span>
            </div>
            <span class="f-badge font-bold text-blue-600 bg-blue-50 px-1.5 py-0.5 rounded-full border border-blue-100 shrink-0 ml-1">${z.assignedVols.length}명</span>
          </div>

          <div class="space-y-1 pt-0.5">
            ${z.assignedVols.map(v => `
              <div class="flex items-center justify-between bg-white p-1.5 rounded-lg border border-slate-100">
                <div class="flex items-center gap-1 min-w-0">
                  <span class="font-bold text-slate-800 f-body truncate">${v.name}</span>
                  <span class="text-slate-400 f-badge font-mono shrink-0">${v.phone ? `(${v.phone.slice(-4)})` : '(번호없음)'}</span>
                </div>
                <div class="flex items-center gap-1 shrink-0 ml-1">
                  <button onclick="sendIndividualSMS('${v.phone || ''}', '${z.no}', '${z.name}', '${z.address}')" class="px-1.5 py-0.5 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded f-sub font-bold border border-emerald-200 flex items-center gap-0.5 transition">
                    <i data-lucide="message-square" class="w-3 h-3"></i>
                    <span>문자</span>
                  </button>
                  <button onclick="removeVolunteerFromZone(${z.id}, ${v.id})" class="px-1.5 py-0.5 text-slate-400 hover:text-rose-500 rounded f-sub transition">
                    삭제
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');

      lucide.createIcons();
    }

    function sendIndividualSMS(phone, zoneNo, zoneName, fullAddr) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const messageBody = `[봉사 구역 배정 안내]
안녕하세요! 오늘 배정된 봉사 구역 안내드립니다.

* 배정 구역: ${zoneNo}호 - ${zoneName}
* 현장 주소: ${fullAddr}

오늘도 즐거운 봉사 되세요~`;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const sep = isIOS ? '&' : '?';

      if (!cleanPhone) {
        window.location.href = `sms:${sep}body=${encodeURIComponent(messageBody)}`;
      } else {
        window.location.href = `sms:${cleanPhone}${sep}body=${encodeURIComponent(messageBody)}`;
      }
    }

    function removeVolunteerFromZone(zoneId, volId) {
      const z = zones.find(item => item.id === zoneId);
      if (z) {
        z.assignedVols = z.assignedVols.filter(v => v.id !== volId);
        saveAssignments();
        renderTodayVolGrid();
        renderZones();
        renderAssignedBoard();
      }
    }

    function resetAllAssignments() {
      if (confirm('현재 배정된 모든 구역 현황을 초기화하시겠습니까?')) {
        zones.forEach(z => z.assignedVols = []);
        saveAssignments();
        renderTodayVolGrid();
        renderZones();
        renderAssignedBoard();
      }
    }

    function saveAssignments() {
      const map = {};
      zones.forEach(z => {
        if (z.assignedVols.length > 0) map[z.id] = z.assignedVols;
      });
      localStorage.setItem('v6_zone_assignments', JSON.stringify(map));
    }

    function filterAttendancePool() {
      const q = document.getElementById('attSearchInput').value.trim().toLowerCase();
      filteredPool = allVolunteers.filter(v => v.name.toLowerCase().includes(q) || v.phone.replace(/[^0-9]/g, '').includes(q));
      renderAttendancePool();
    }

    function filterZones() {
      const q = document.getElementById('zoneSearchInput').value.trim().toLowerCase();
      filteredZones = zones.filter(z => z.no.toLowerCase().includes(q) || z.name.toLowerCase().includes(q) || z.address.toLowerCase().includes(q));
      renderZones();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
