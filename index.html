<body class="bg-slate-100 text-slate-900 min-h-screen pb-24">

      </div>
      <div class="flex items-center gap-2">
        <span class="text-xs text-slate-500 font-medium">출석:</span>
        <span id="todayCountBadge" class="text-xs font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-lg border border-emerald-200">0명</span>
        <span class="text-xs text-slate-500 font-medium ml-1">배정:</span>
        <span id="assignedCountBadge" class="text-xs font-bold text-blue-600 bg-blue-50 px-2 py-0.5 rounded-lg border border-blue-200">0명</span>
      </div>
    </div>
  </header>

        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-blue-600 text-white text-[10px] flex items-center justify-center font-bold">1</span>
          오늘 참여자 체크 (<span id="totalPoolCount">77</span>명 중 선택)
        </label>
        <button onclick="clearTodayAttendance()" class="text-[11px] text-slate-400 hover:text-rose-500 transition">출석 초기화</button>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" id="attSearchInput" oninput="filterAttendancePool()" placeholder="봉사자 검색 (이름 또는 전화번호 뒷자리)" class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-blue-500">
      </div>

      <div class="grid grid-cols-2 gap-1.5 max-h-36 overflow-y-auto pr-1 no-scrollbar" id="attendanceGrid"></div>
      <p class="text-[10px] text-slate-400 text-center">* 터치하면 오늘 참여자로 등록/취소됩니다.</p>
    </section>

    <!-- 2단계: 오늘 참여자 중 배정할 인원 다중 선택 (배정 완료 인원 선택 차단) -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] flex items-center justify-center font-bold">2</span>
          배정할 참여자 선택 (<span id="selectedVolCountLabel" class="text-blue-600 font-bold">0명 선택됨</span>)
        </label>
        <div class="flex items-center gap-2">
          <button onclick="selectAllAvailableTodayVols()" class="text-[11px] text-blue-600 hover:underline">대기자 전체선택</button>
          <span class="text-slate-300 text-xs">|</span>
          <button onclick="clearSelectedVols()" class="text-[11px] text-slate-400 hover:underline">선택해제</button>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 max-h-44 overflow-y-auto pr-1 no-scrollbar" id="todayVolGrid"></div>
      <p class="text-[10px] text-slate-400 text-center">* 이미 배정된 참여자는 회색으로 잠겨 선택할 수 없습니다.</p>
    </section>

    <!-- 3단계: 구역카드 선택 -->
    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-2.5">
      <div class="flex items-center justify-between">
        <label class="text-xs font-bold text-slate-800 flex items-center gap-1.5">
          <span class="w-4 h-4 rounded-full bg-slate-900 text-white text-[10px] flex items-center justify-center font-bold">3</span>
          구역카드 선택 (<span id="zoneCountDisplay">131</span>개)
        </label>
        <span class="text-[11px] text-emerald-600 font-bold" id="selectedZoneLabel">1호 선택됨</span>
      </div>

      <div class="relative">
        <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-2.5"></i>
        <input type="text" id="zoneSearchInput" oninput="filterZones()" placeholder="구역 번호나 명칭 검색 (예: 36, 안동국시)" class="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:border-emerald-500">
      </div>

      <div class="space-y-1.5 max-h-48 overflow-y-auto pr-1 no-scrollbar" id="zoneList"></div>
    </section>

    <!-- 배정 확정 버튼 -->
    <div>
      <button onclick="confirmMultipleAssignment()" id="btnConfirmAssign" class="w-full py-4 bg-blue-600 hover:bg-blue-700 active:scale-[0.98] rounded-2xl text-white font-bold text-sm shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2 transition">
        <i data-lucide="user-plus" class="w-4 h-4"></i>
        <span id="assignBtnText">선택한 인원 배정 확정하기</span>
      </button>
      <p class="text-[10px] text-slate-400 text-center mt-2">
        * 배정 완료 후 아래 현황판에서 개별적으로 문자를 발송할 수 있습니다.
      </p>
    </div>

    <section class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">

    </section>

    // 1단계: 당일 출석 체크 풀
    function renderAttendancePool() {
      const container = document.getElementById('attendanceGrid');
      container.innerHTML = filteredPool.map(v => {
        const isAttended = attendedIds.has(v.id);
        return `
          <button type="button" onclick="toggleAttendance(${v.id})" class="p-2 rounded-xl border text-left text-xs transition flex items-center justify-between ${isAttended ? 'bg-blue-50 border-blue-400 text-blue-900 font-bold' : 'bg-slate-50 border-slate-200 text-slate-600'}">

          </button>
        `;
      }).join('');
      lucide.createIcons();
    }

    function toggleAttendance(id) {
      if (attendedIds.has(id)) {
        attendedIds.delete(id);
        selectedVolIds.delete(id);
      } else {
        attendedIds.add(id);
      }
      localStorage.setItem('v6_attended_ids', JSON.stringify([...attendedIds]));
      renderAttendancePool();
      renderTodayVolGrid();
    }

    function clearTodayAttendance() {
      if (confirm('오늘 출석 체크를 모두 초기화하시겠습니까?')) {
        attendedIds.clear();
        selectedVolIds.clear();
        localStorage.removeItem('v6_attended_ids');
        renderAttendancePool();
        renderTodayVolGrid();
      }
    }

    // 2단계: 오늘 참여자 그리드
    function renderTodayVolGrid() {
      const container = document.getElementById('todayVolGrid');
      document.getElementById('todayCountBadge').innerText = `${attendedIds.size}명`;

      const todayList = allVolunteers.filter(v => attendedIds.has(v.id));
      const assignedMap = getAssignedVolunteerMap();

      if (todayList.length === 0) {
        container.innerHTML = '<div class="col-span-2 py-4 text-center text-xs text-slate-400 italic">위 1단계에서 오늘 출석한 봉사자를 먼저 체크해 주세요.</div>';
        document.getElementById('selectedVolCountLabel').innerText = '0명 선택됨';
        updateAssignBtn();
        return;
      }

      container.innerHTML = todayList.map(v => {
        const isAssigned = assignedMap.has(v.id);
        const assignedZoneNo = assignedMap.get(v.id);
        const isChecked = selectedVolIds.has(v.id);

        if (isAssigned) {
          return `
            <div class="p-2.5 rounded-xl border border-slate-200/80 bg-slate-100 text-slate-400 text-xs flex items-center justify-between opacity-60 cursor-not-allowed select-none">
              <div class="flex flex-col">
                <span class="font-medium line-through">${v.name}</span>
                <span class="text-[10px] text-slate-400 font-mono">${v.phone.slice(-4)}</span>
              </div>
              <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 font-bold">${assignedZoneNo}호 배정됨</span>
            </div>
          `;
        }

        return `
          <button type="button" onclick="toggleSelectVol(${v.id})" class="p-2.5 rounded-xl border text-left text-xs transition flex items-center justify-between ${isChecked ? 'bg-blue-600 text-white border-blue-600 font-bold shadow-sm' : 'bg-slate-50 text-slate-700 border-slate-200 hover:bg-white'}">
            <div class="flex flex-col">
              <span>${v.name}</span>
              <span class="text-[10px] ${isChecked ? 'text-blue-200' : 'text-slate-400'} font-mono">${v.phone.slice(-4)}</span>
            </div>
            ${isChecked ? '<i data-lucide="check-circle-2" class="w-4 h-4 text-white"></i>' : '<div class="w-4 h-4 rounded-full border border-slate-300 bg-white"></div>'}
          </button>
        `;
      }).join('');

      document.getElementById('selectedVolCountLabel').innerText = `${selectedVolIds.size}명 선택됨`;
      updateAssignBtn();
      lucide.createIcons();
    }

    function toggleSelectVol(id) {
      const assignedMap = getAssignedVolunteerMap();
      if (assignedMap.has(id)) return;

      if (selectedVolIds.has(id)) {
        selectedVolIds.delete(id);
      } else {
        selectedVolIds.add(id);
      }
      renderTodayVolGrid();
    }

    function selectAllAvailableTodayVols() {
      const assignedMap = getAssignedVolunteerMap();
      allVolunteers
        .filter(v => attendedIds.has(v.id) && !assignedMap.has(v.id))
        .forEach(v => selectedVolIds.add(v.id));
      renderTodayVolGrid();
    }

    function clearSelectedVols() {
      selectedVolIds.clear();
      renderTodayVolGrid();
    }

    function updateAssignBtn() {
      const count = selectedVolIds.size;
      const btnText = document.getElementById('assignBtnText');
      if (count === 0) {
        btnText.innerText = '배정할 인원을 선택해 주세요';
      } else {
        btnText.innerText = `선택한 ${count}명 배정 확정하기`;
      }
    }

    function selectZone(id) {

    // 다중 배정 확정
    function confirmMultipleAssignment() {
      if (selectedVolIds.size === 0) {
        alert('오늘 참여자 중 배정할 봉사자를 1명 이상 선택해 주세요.');
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      let addedNames = [];

      selectedVolIds.forEach(volId => {
        const vol = allVolunteers.find(v => v.id === volId);
        selectedZone.assignedVols.push({
          id: vol.id,
          name: vol.name,
          phone: vol.phone,
          time: timeStr
        });
        addedNames.push(vol.name);
      });

      saveAssignments();
      selectedVolIds.clear();

      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();

      alert(`[배정 완료]\n${selectedZone.no}호 (${selectedZone.name})\n👉 ${addedNames.join(', ')} (${addedNames.length}명) 등록 완료!\n* 배정된 참여자는 대기자 목록에서 자동 잠금됩니다.`);
    }

    // 링크 없는 간결한 안내 문자 발송 함수
    function sendIndividualSMS(phone, zoneNo, zoneName, fullAddr) {
      const cleanPhone = phone.replace(/[^0-9]/g, '');
      const messageBody = `[봉사 구역 배정 안내]
안녕하세요! 오늘 배정된 봉사 구역 안내드립니다.

* 배정 구역: ${zoneNo}호 - ${zoneName}
* 현장 주소: ${fullAddr}

오늘도 즐거운 봉사 되세요~`;

      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      const sep = isIOS ? '&' : '?';
      window.location.href = `sms:${cleanPhone}${sep}body=${encodeURIComponent(messageBody)}`;
    }

    function removeVolunteerFromZone(zoneId, volId) {
      const z = zones.find(item => item.id === zoneId);
      z.assignedVols = z.assignedVols.filter(v => v.id !== volId);
      saveAssignments();
      renderTodayVolGrid();
      renderZones();
      renderAssignedBoard();
    }

    function resetAllAssignments() {
      if (confirm('현재 배정된 모든 구역 현황을 초기화하시겠습니까?')) {
        zones.forEach(z => z.assignedVols = []);
        saveAssignments();
        renderTodayVolGrid();
        renderZones();
        renderAssignedBoard();
      }
    }

    function saveAssignments() {
      const map = {};
      zones.forEach(z => {
        if (z.assignedVols.length > 0) map[z.id] = z.assignedVols;
      });
      localStorage.setItem('v6_zone_assignments', JSON.stringify(map));
    }

    function filterAttendancePool() {
      const q = document.getElementById('attSearchInput').value.trim().toLowerCase();
      filteredPool = allVolunteers.filter(v => v.name.toLowerCase().includes(q) || v.phone.replace(/[^0-9]/g, '').includes(q));
      renderAttendancePool();
    }

    function filterZones() {
      const q = document.getElementById('zoneSearchInput').value.trim().toLowerCase();
      filteredZones = zones.filter(z => z.no.toLowerCase().includes(q) || z.name.toLowerCase().includes(q) || z.address.toLowerCase().includes(q));
      renderZones();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
